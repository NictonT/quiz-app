<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Manager</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Inlined styles from previous example for simplicity -->
    <style>
        #visualEditorContainer { border: 1px solid #ccc; padding: 10px; margin-top: 10px; border-radius: 5px; max-height: 400px; overflow-y: auto; }
        body.night-mode #visualEditorContainer { border-color: #555; }
        .visual-question { background: rgba(0,0,0,0.05); padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        body.night-mode .visual-question { background: rgba(255,255,255,0.08); }
        .visual-question label, .visual-answer label { display: block; margin-bottom: 5px; font-weight: bold;}
        .visual-question input[type="text"], .visual-question textarea { width: calc(100% - 22px); margin-bottom: 5px; padding: 8px; border: 1px solid #ccc; border-radius: 3px; }
        body.night-mode .visual-question input[type="text"], body.night-mode .visual-question textarea { background-color: #444; border-color: #666; color: #eee; }
        /* Updated visual answer styles */
        .visual-answer { margin-left: 20px; padding: 5px 0 5px 10px; border-left: 2px solid var(--secondary-color); margin-bottom: 3px; }
        .visual-answer label { display: inline-flex !important; align-items: center; margin-right: 10px; font-weight: normal; cursor: pointer; }
        .visual-answer input[type="radio"] { margin-right: 5px; cursor: pointer; }
        .visual-answer input[type="text"] { display: inline-block; width: calc(100% - 80px); /* Adjust width */ padding: 4px 6px; font-size: 0.95em; border: 1px solid #ccc; border-radius: 3px; }
        body.night-mode .visual-answer input[type="text"] { background-color: #444; border-color: #666; color: #eee; }

        .visual-controls button { margin-right: 5px; padding: 3px 8px; font-size: 0.9em;}
        #visualEditorContainer .button.small { padding: 5px 10px; font-size: 0.9em; margin-top: 10px; }
        #executionFrame { width: 100%; height: 400px; border: none; } /* Kept for potential future use */
    </style>
</head>
<body>

    <div class="slide active" id="filesPage">
        <button class="button secondary back-button" onclick="fileManager.goBack()">Back</button>
        <div class="header">
            <h1 id="pageTitle">Files</h1>
            <div class="toggle-container">
                <input type="checkbox" id="nightModeToggleFiles" class="toggle" />
                <label for="nightModeToggleFiles" class="toggle-label"></label>
            </div>
        </div>
        <div class="content" id="fileContentContainer">
            <div class="control-panel">
                <button class="button secondary list-button" onclick="fileManager.toggleFileList()">List ↑</button>
                <button class="button secondary" onclick="fileManager.showAddFileModal()">+</button>
                <button class="button" onclick="clearLocalStorage()">Clear File Storage</button>
            </div>
            <div id="filesContainer"></div>
        </div>
    </div>

    <div class="slide hidden" id="editPage">
        <button class="button secondary back-button" onclick="fileManager.closeEditFileModal()">Back</button>
        <div class="header">
            <h1>Edit File
                <span id="currentEditFileName" class="file-name"></span>
            </h1>
            <div class="toggle-container">
                 <input type="checkbox" id="nightModeToggleEdit" class="toggle" />
                 <label for="nightModeToggleEdit" class="toggle-label"></label>
            </div>
        </div>
        <div class="content">
            <div class="edit-controls" style="margin-bottom: 15px; text-align: right;">
                 <button id="viewToggleBtn" class="button secondary" onclick="fileManager.toggleEditorView()" style="display: none;">Switch to Visual View</button>
            </div>

            <div id="codeEditorView">
                 <textarea id="fileContent" rows="15"></textarea>
            </div>

            <div id="visualEditorView" class="hidden" style="text-align: left;">
                <div id="visualEditorContainer">
                    <!-- Visual editor content generated by JS -->
                </div>
                <!-- Add/Delete buttons for this format are complex, simplified for now -->
                 <button class="button primary small" onclick="fileManager.addVisualQuestion()">+ Add Question (Basic)</button>
            </div>

            <div class="button-container" style="margin-top: 20px;">
                <button class="button primary save-button" onclick="fileManager.saveFile()">Save</button>
                <button class="button secondary execute-button" onclick="fileManager.executeFileContent()">Execute Quiz</button>
            </div>
        </div>
    </div>

    <div id="addFileModal" class="modal hidden">
        <div class="modal-content">
            <span class="close" onclick="fileManager.closeAddFileModal()">×</span>
            <h2>Add New File</h2>
            <label for="fileType">File Type:</label>
            <select id="fileType">
                <option value="JSON">JSON</option>
                <option value="Folder">Folder</option>
            </select>
            <input type="text" id="fileNameInput" placeholder="Enter file name">
            <button class="button primary" onclick="fileManager.addNewFile()">Add</button>
        </div>
    </div>

    <div id="renameFileModal" class="modal hidden">
        <div class="modal-content">
            <span class="close" onclick="fileManager.closeRenameFileModal()">×</span>
            <h2>Rename File</h2>
            <input type="text" id="newFileNameInput" placeholder="Enter new file name">
            <button class="button primary" onclick="fileManager.renameFile()">Rename</button>
        </div>
    </div>

    <!-- Execution Modal - Kept in DOM but no longer used for quiz execution -->
    <div id="executionModal" class="modal hidden">
        <div class="modal-content" style="width: 80%; max-width: 800px;">
            <span class="close" onclick="fileManager.closeExecutionModal()">×</span>
            <h2>Execution Result</h2>
            <iframe id="executionFrame"></iframe>
        </div>
    </div>

    <script src="files.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            function generateUniqueIdLocal() {
                return '_' + Math.random().toString(36).substr(2, 9);
            }

            function createDefaultQuizContent(title) {
                return JSON.stringify({
                    question: `Sample question for ${title}?`,
                    answers: { "A": "Option A", "B": "Option B", "C": "Option C" },
                    correctAnswer: "A"
                }, null, 2);
            }

            // Helper to find or create an item (file or folder)
            function findOrCreateItem(parentContentArray, itemName, itemType, defaultFileContentGenerator) {
                let item = parentContentArray.find(it => it.name === itemName && it.type === itemType);
                if (!item) {
                    item = {
                        id: generateUniqueIdLocal(),
                        name: itemName,
                        type: itemType,
                        content: itemType === 'Folder' ? [] : (defaultFileContentGenerator ? defaultFileContentGenerator(itemName) : '')
                    };
                    parentContentArray.push(item);
                }
                if (itemType === 'Folder' && !Array.isArray(item.content)) { // Ensure folder content is array
                    item.content = [];
                }
                return item;
            }

            // --- START: Ensure "quiz-app/3 D-E-F-G/" nested folder structure exists ---
            try {
                let filesFromStorage = JSON.parse(localStorage.getItem('files')) || [];

                // 1. "quiz-app" folder
                const quizAppFolder = findOrCreateItem(filesFromStorage, 'quiz-app', 'Folder');

                // 2. "3 D-E-F-G" folder inside "quiz-app"
                const threeDEFGFolder = findOrCreateItem(quizAppFolder.content, '3 D-E-F-G', 'Folder');

                // 3. Inside "3 D-E-F-G":
                //    a. "Study Material" folder
                const studyMaterialFolder = findOrCreateItem(threeDEFGFolder.content, 'Study Material', 'Folder');
                findOrCreateItem(studyMaterialFolder.content, 'Chapter1_Notes.txt', 'JSON', createDefaultQuizContent);
                findOrCreateItem(studyMaterialFolder.content, 'Key_Definitions.txt', 'JSON', createDefaultQuizContent);

                //    b. "Practice Sets" folder
                const practiceSetsFolder = findOrCreateItem(threeDEFGFolder.content, 'Practice Sets', 'Folder');
                findOrCreateItem(practiceSetsFolder.content, 'Set_Alpha.txt', 'JSON', createDefaultQuizContent);
                
                //    c. "Old Exams" folder inside "Practice Sets"
                const oldExamsFolder = findOrCreateItem(practiceSetsFolder.content, 'Old Exams', 'Folder');
                findOrCreateItem(oldExamsFolder.content, 'Midterm_2023.txt', 'JSON', createDefaultQuizContent);

                //    d. "Misc_Quiz.txt" file directly in "3 D-E-F-G"
                findOrCreateItem(threeDEFGFolder.content, 'Misc_Quiz.txt', 'JSON', createDefaultQuizContent);

                localStorage.setItem('files', JSON.stringify(filesFromStorage));
                console.log("Default nested file structure ensured:", JSON.parse(JSON.stringify(filesFromStorage)));

            } catch (e) {
                console.error("Error initializing default file structure:", e);
            }
            // --- END: Ensure "quiz-app/3 D-E-F-G/" nested folder structure ---

            window.fileManager = new FileManager();

            const nightModeToggleEdit = document.getElementById('nightModeToggleEdit');
            if (nightModeToggleEdit) {
                 nightModeToggleEdit.addEventListener('change', () => {
                     fileManager.toggleNightMode(nightModeToggleEdit.checked);
                 });
                 const filesToggle = document.getElementById('nightModeToggleFiles');
                 if (filesToggle) {
                      nightModeToggleEdit.checked = filesToggle.checked;
                 }
            }

            if (typeof window.clearLocalStorage === 'undefined') {
                window.clearLocalStorage = function() {
                    if (confirm('Are you sure you want to clear all files? This cannot be undone.')) {
                        localStorage.removeItem('files');
                        localStorage.removeItem('nightMode');
                        localStorage.removeItem('quizDataToExecute');
                        window.location.reload();
                    }
                }
            }
        });
    </script>
</html>
