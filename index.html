<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Application</title>
    <!-- Assuming you have styles.css for this page -->
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="slide active" id="mainPage">
        <div class="header">
            <h1>Quiz Application</h1>
            <div class="toggle-container">
                <!-- Make sure toggle ID is unique if sharing CSS/JS logic across pages -->
                <input type="checkbox" id="nightModeToggleMain" class="toggle" />
                <label for="nightModeToggleMain" class="toggle-label">Night Mode</label>
            </div>
        </div>
        <div class="content">
            <h2>Enter your questions in JSON format</h2>
            <textarea id="jsonInput" rows="10" placeholder='[
  {
    "question": "What is the capital city of Japan?",
    "answers": {
      "A": "Beijing",
      "B": "Seoul",
      "C": "Tokyo",
      "D": "Bangkok"
    },
    "correctAnswer": "C"
  }
]
// Enter a single question object or an array like above.
            '></textarea>
            <button class="button primary" id="executeButton" onclick="executeQuizFromInput()">Execute</button>
            <button class="button secondary" onclick="goToFilesPage()">Files</button>
        </div>
    </div>

    <!-- Link to the correct JavaScript file for this page -->
    <script src="script.js"></script>
</body>
</html>
